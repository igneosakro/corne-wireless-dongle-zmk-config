include:
  # -----------------------------------------
  # Your other keyboard parts here
  # -----------------------------------------
  # Change the board appropriately, you can use any board
  - board: xiao_ble
    shield: corne_dongle dongle_display
    artifact-name: corne_dongle_xiao_ble
    
  # Add these cmake-args to the peripherals you wish to use with the dongle
  - board: nice_nano@2.0.0//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_nice_nano_v2
  - board: nice_nano@2.0.0//zmk
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_right_nice_nano_v2

  - board: nice_nano
    shield: settings_reset
  - board: xiao_ble
    shield: settings_reset
